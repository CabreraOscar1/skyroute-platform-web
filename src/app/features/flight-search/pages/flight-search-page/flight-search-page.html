<main class="page-shell">
  <header class="page-header">
    <div>
      <p class="eyebrow">SkyRoute</p>
      <h1>{{ t().appTitle }}</h1>
      <p class="subtitle">{{ t().appSubtitle }}</p>
    </div>

    <div class="header-actions">
      <div class="language-switch" aria-label="Language selector">
        @for (option of language.options; track option.code) {
          <button
            type="button"
            [class.active]="language.language() === option.code"
            (click)="setLanguage(option.code)"
          >
            {{ option.label }}
          </button>
        }
      </div>

      <div class="api-status" aria-live="polite">
        <span [class.busy]="isBusy()"></span>
        {{ isBusy() ? t().processing : t().ready }}
      </div>
    </div>
  </header>

  @if (error()) {
    <p class="status error" role="alert">{{ error() }}</p>
  }

  <app-flight-search-form
    [airports]="airports()"
    [loading]="loadingAirports() || searching()"
    (search)="searchFlights($event)"
  />

  <section class="workspace">
    <app-flight-results-list
      [offers]="offers()"
      [selectedOfferId]="selectedOffer()?.offerId ?? null"
      [loading]="searching()"
      [hasSearched]="hasSearched()"
      (selected)="selectOffer($event)"
    />

    <app-booking-panel
      [selectedOffer]="selectedOffer()"
      [booking]="booking()"
      [loading]="bookingInProgress()"
      (confirmed)="confirmBooking($event)"
    />
  </section>
</main>
